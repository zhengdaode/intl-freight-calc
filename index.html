<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际运费加权计算器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}</style>
</head>
<body class="bg-gray-50 min-h-screen">

<div id="ifcApp" class="max-w-6xl mx-auto px-4 py-6">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">🌍 国际运费加权计算器</h1>
            <p class="text-xs text-gray-400 mt-1">按重量比例分摊国际运费 · 支持手动加权微调</p>
        </div>
        <button onclick="ifcShowNewBatchDialog()" class="px-4 py-2 bg-blue-500 text-white rounded-lg text-sm font-bold hover:bg-blue-600 shadow-sm">+ 新建批次</button>
    </div>

    <div class="mb-4 flex items-center gap-3">
        <span class="text-sm text-gray-500">当前批次：</span>
        <select id="ifcBatchSelect" onchange="ifcSwitchBatch()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm flex-1 max-w-xs focus:border-blue-400 focus:outline-none">
            <option value="">-- 无批次 --</option>
        </select>
        <button onclick="ifcDeleteBatch(ifcCurrentBatchId);ifcRender();ifcShowToast('批次已删除','info')" class="text-xs text-red-400 hover:text-red-600">删除当前批次</button>
    </div>

    <div id="ifcPanel" class="mb-6"></div>
    <div id="ifcTableContainer" class="bg-white rounded-xl shadow-sm border border-gray-200 p-4"></div>
</div>

<script src="js/ifc-core.js"></script>
<script src="js/ifc-data.js"></script>
<script src="js/ifc-calc.js"></script>
<script src="js/ifc-panel.js"></script>
<script src="js/ifc-table.js"></script>
<script src="js/ifc-import.js"></script>
<script src="js/ifc-export.js"></script>
<script>ifcInit();</script>
</body>
</html>
